<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Para ti ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --rojo: #ff1e2d;
      --negro: #0a0a0c;
      --gris: #1a1a1f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { height: 100%; }
    body {
      height: 100dvh;
      background: var(--negro);
      color: white;
      font-family: 'Arial Black', Impact, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      text-align: center;
      padding: 16px 8px 0;
      letter-spacing: 3px;
      color: var(--rojo);
      text-shadow: 0 0 12px var(--rojo);
      font-size: 18px;
    }
    #escena {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid var(--rojo);
    }
    #panel {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      background: var(--gris);
      color: white;
      border: 2px solid var(--rojo);
      border-radius: 12px;
      padding: 16px 8px;
      font-size: 14px;
      font-family: inherit;
    }

    /* ===== PANTALLA DE ENTRADA ===== */
    #intro {
      position: fixed;
      inset: 0;
      background: var(--negro);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.8s;
    }
    #intro.oculto { opacity: 0; pointer-events: none; }
    #terminal {
      font-family: 'Courier New', monospace;
      color: var(--rojo);
      font-size: 14px;
      line-height: 1.9;
      min-height: 160px;
      width: 100%;
      max-width: 320px;
      text-shadow: 0 0 8px var(--rojo);
    }
    #btnEncender {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      font-size: 16px;
      margin-top: 32px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s;
      box-shadow: 0 0 20px var(--rojo);
      animation: latido 1.2s infinite;
    }
    #btnEncender.visible { opacity: 1; pointer-events: auto; }
    @keyframes latido {
      50% { box-shadow: 0 0 45px var(--rojo); transform: scale(1.06); }
    }

    /* ===== AUTO ===== */
    #escena svg {
      width: 100%;
      max-width: 460px;
      height: auto;
      filter: drop-shadow(0 0 10px rgba(255, 30, 45, 0.35));
    }
    .rin {
      transform-box: fill-box;
      transform-origin: center;
    }
    #haz { opacity: 0; transition: opacity 0.4s; }
    #auto.encendido #haz { opacity: 1; }
    #auto.encendido #faro { fill: #ffffff; filter: url(#glow); }

    /* ===== VIBRACIÓN DEL MOTOR ===== */
    @keyframes vibrar {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(0.6px, -0.8px); }
      50%  { transform: translate(-0.6px, 0.6px); }
      75%  { transform: translate(0.5px, 0.8px); }
      100% { transform: translate(0, 0); }
    }
    #auto.encendido #cuerpo { animation: vibrar 0.09s infinite; }

    /* ===== NITRO, TACÓMETRO Y CARRETERA ===== */
    #escena {
      position: relative;
      overflow: hidden;
      flex-direction: column;
      gap: 4px;
    }
    #escena > svg, #tacometro, #carretera { position: relative; z-index: 2; }
    #escena #tacometro { width: 55%; max-width: 230px; height: auto; }    #aguja {
      transform-origin: 100px 100px;
      transform: rotate(-90deg);
    }
    #llama {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: right center;
    }
    body.nitro #llama { opacity: 1; animation: llama 0.07s infinite alternate; }
    @keyframes llama {
      from { transform: scale(0.65, 0.85); }
      to   { transform: scale(1.1, 1.15); }
    }
    body.nitro .rin { animation: girar 0.25s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }

    #carretera {
      width: 100%;
      height: 6px;
      background: repeating-linear-gradient(90deg, var(--rojo) 0 40px, transparent 40px 90px);
      opacity: 0.4;
      animation: ruta 0.35s linear infinite;
      animation-play-state: paused;
    }
    body.nitro #carretera { animation-play-state: running; opacity: 1; }
    @keyframes ruta { to { background-position-x: -90px; } }

    #lineas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    #lineas span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,0.6) 0 60px, transparent 60px 220px);
      opacity: 0;
      animation: ruta 0.3s linear infinite;
    }
    body.nitro #lineas span { opacity: 0.5; }
    #btnNitro { touch-action: none; -webkit-touch-callout: none; }

    /* ===== LUCES ALTAS ===== */
    #auto.altas #haz {
      opacity: 1;
      transition: none;
      filter: brightness(2) drop-shadow(0 0 10px #fff);
      transform-box: fill-box;
      transform-origin: left center;
      transform: scale(1.1, 1.5);
    }
    #auto.altas #faro { fill: #ffffff; filter: url(#glow); }

    /* ===== REGALO SECRETO ===== */
    #modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    #modal.abierto { opacity: 1; pointer-events: auto; }
    #tarjeta {
      width: 100%;
      max-width: 340px;
      max-height: 90dvh;
      overflow-y: auto;
      background: var(--gris);
      border: 2px solid var(--rojo);
      border-radius: 18px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 30, 45, 0.5);
      transform: scale(0.8);
      transition: transform 0.5s;
    }
    #modal.abierto #tarjeta { transform: scale(1); }
    #tarjetaTitulo {
      color: var(--rojo);
      text-shadow: 0 0 12px var(--rojo);
      font-size: 20px;
      line-height: 1.3;
      margin-bottom: 16px;
    }
    #tarjetaTexto {
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-line;
      margin-bottom: 16px;
    }
    #tarjetaFirma {
      font-family: Arial, sans-serif;
      color: #bbb;
      font-size: 14px;
      margin-bottom: 20px;
    }
    #confeti {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }
    /* Luz trasera encendida con el motor */
    #auto.encendido #faroTras { fill: #ff1e2d; filter: url(#glow); }

    /* ===== PANEL DE CONTROLES TIPO JUEGO ===== */
    #panel {
      --t: clamp(54px, 16vw, 66px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      padding: 14px 12px calc(16px + env(safe-area-inset-bottom, 0px));
    }
    #panel button {
      background: none;
      border: 0;
      border-radius: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      color: #8a8a95;
      font-family: Arial, sans-serif;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1.5px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .aro {
      width: var(--t);
      height: var(--t);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 28%, #2e2e36, #101013 70%);
      border: 2px solid var(--rojo);
      box-shadow: 0 0 12px rgba(255, 30, 45, 0.35), inset 0 0 10px rgba(0, 0, 0, 0.8);
      transition: transform 0.12s, box-shadow 0.2s, background 0.2s;
    }
    .aro svg {
      width: 46%;
      height: 46%;
      fill: none;
      stroke: var(--rojo);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 4px rgba(255, 30, 45, 0.8));
      transition: stroke 0.2s;
    }
    #panel button:active .aro {
      transform: scale(0.92);
      box-shadow: 0 0 24px rgba(255, 30, 45, 0.85), inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    /* START: se enciende cuando el motor está en marcha */
    #btnMotor.activo .aro {
      background: radial-gradient(circle at 50% 35%, #ff4350, #a30010);
      box-shadow: 0 0 26px var(--rojo), inset 0 0 8px rgba(0, 0, 0, 0.5);
    }
    #btnMotor.activo svg { stroke: #fff; filter: drop-shadow(0 0 4px #fff); }
    #btnMotor.activo { color: var(--rojo); }
    #btnMotor.pista .aro { animation: pista 0.3s 3; }
    @keyframes pista { 50% { box-shadow: 0 0 34px #fff; } }

    /* NITRO: pedal más grande */
    #btnNitro .aro {
      width: calc(var(--t) * 1.2);
      height: calc(var(--t) * 1.55);
      border-radius: 22px 22px 30px 30px;
      background:
              repeating-linear-gradient(180deg, transparent 0 9px, rgba(255, 255, 255, 0.05) 9px 11px),
              radial-gradient(circle at 35% 20%, #34343c, #0f0f12 75%);
    }
    #btnNitro svg { width: 52%; height: auto; }
    #btnNitro.aviso .aro { animation: sacudir 0.35s; }
    @keyframes sacudir {
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    body.nitro #btnNitro .aro {
      transform: translateY(4px) scale(0.95);
      background: radial-gradient(circle at 50% 30%, #ff9a3a, #c2300a);
      box-shadow: 0 0 30px #ff5a00, inset 0 0 8px rgba(0, 0, 0, 0.5);
      border-color: #ffb347;
    }
    body.nitro #btnNitro svg { stroke: #fff; filter: drop-shadow(0 0 5px #ffd23a); }
    body.nitro #btnNitro { color: #ff9a3a; }

    /* REGALO: dorado y latiendo */
    #btnRegalo .aro {
      border-color: #ffd23a;
      box-shadow: 0 0 14px rgba(255, 210, 58, 0.5), inset 0 0 10px rgba(0, 0, 0, 0.8);
      animation: latidoRegalo 1.6s ease-in-out infinite;
    }
    #btnRegalo svg { stroke: #ffd23a; filter: drop-shadow(0 0 4px rgba(255, 210, 58, 0.8)); }
    #btnRegalo { color: #c9a62e; }
    @keyframes latidoRegalo {
      50% { box-shadow: 0 0 28px rgba(255, 210, 58, 0.9), inset 0 0 10px rgba(0, 0, 0, 0.8); transform: scale(1.06); }
    }

    /* ===== AMBIENTE NOCTURNO ===== */
    #escena {
      justify-content: flex-end;
      padding-bottom: 20px;
      background:
              radial-gradient(ellipse at 50% 88%, rgba(255, 30, 45, 0.22), transparent 60%),
              linear-gradient(180deg, #07070a 0%, #130a1d 50%, #1c0a14 78%, #0a0a0c 100%);
    }

    /* Cielo: estrellas y luna */
    #cielo {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
              radial-gradient(circle 14px at 84% 13%, #efe6e8 0 62%, transparent 66%),
              radial-gradient(circle 44px at 84% 13%, rgba(255, 255, 255, 0.10), transparent),
              radial-gradient(1.5px 1.5px at 10% 14%, #fff, transparent),
              radial-gradient(1px 1px at 22% 7%, #fff, transparent),
              radial-gradient(1.5px 1.5px at 34% 22%, #fff, transparent),
              radial-gradient(1px 1px at 46% 10%, #fff, transparent),
              radial-gradient(1px 1px at 58% 5%, #fff, transparent),
              radial-gradient(1.5px 1.5px at 68% 19%, #fff, transparent),
              radial-gradient(1px 1px at 76% 6%, #fff, transparent),
              radial-gradient(1px 1px at 6% 32%, #fff, transparent),
              radial-gradient(1.5px 1.5px at 92% 30%, #fff, transparent),
              radial-gradient(1px 1px at 16% 44%, #fff, transparent),
              radial-gradient(1px 1px at 88% 48%, #fff, transparent);
      animation: titilar 4s ease-in-out infinite alternate;
    }
    @keyframes titilar { from { opacity: 0.55; } to { opacity: 1; } }
    #cielo::after {
      content: "";
      position: absolute;
      top: 9%;
      left: -12%;
      width: 90px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #fff);
      opacity: 0;
      animation: estrellaFugaz 9s ease-in 3s infinite;
    }
    @keyframes estrellaFugaz {
      0%   { transform: translate(0, 0) rotate(24deg); opacity: 0; }
      3%   { opacity: 1; }
      12%  { transform: translate(480px, 220px) rotate(24deg); opacity: 0; }
      100% { transform: translate(480px, 220px) rotate(24deg); opacity: 0; }
    }

    /* Pista: ciudad, piso mojado y reflejo */
    #pista {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #auto {
      position: relative;
      z-index: 2;
      -webkit-box-reflect: below -7px linear-gradient(transparent 52%, rgba(255, 255, 255, 0.36));
    }
    #suelo {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 90px;
      margin-top: -8px;
      background: linear-gradient(180deg, #170a10 0%, #0d0a0e 55%, #0a0a0c 100%);
      border-top: 1px solid rgba(255, 30, 45, 0.28);
    }
    #pista #carretera {
      position: absolute;
      left: 0;
      bottom: 20px;
      z-index: 3;
    }
    .ciudad {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 82px;
      height: 120px;
      z-index: 0;
      background-repeat: repeat-x;
      background-position: 0 100%;
      animation: avanzarCiudad linear infinite;
      animation-play-state: paused;
    }

    body.nitro .ciudad { animation-play-state: running; }
    @keyframes avanzarCiudad { to { background-position-x: -480px; } }

    /* ===== TABLERO PRO ===== */
    body { font-family: 'Orbitron', 'Arial Black', Impact, sans-serif; }
    header { font-size: 17px; font-weight: 900; padding-top: 14px; }

    /* Placa del auto */
    #placa {
      display: flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      margin: 7px auto 0;
      padding: 3px 12px 3px 8px;
      background: linear-gradient(180deg, #f6f6f8, #c6c6ce);
      color: #14141a;
      text-shadow: none;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 3px;
      border: 2px solid #1a1a1f;
      border-radius: 5px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 0 14px rgba(255, 255, 255, 0.18);
    }
    #placa::before {
      content: "";
      width: 3px;
      height: 13px;
      background: var(--rojo);
      border-radius: 2px;
    }
    #placa b { color: #d4121f; }

    #btnEncender { font-size: 13px; letter-spacing: 1px; }
    #panel button { font-family: 'Orbitron', Arial, sans-serif; font-size: 8px; letter-spacing: 1px; }

    /* Velocímetro digital, marcha y luces testigo */
    .digital { font-family: 'Orbitron', 'Arial Black', sans-serif; }
    #kmh {
      font-size: 18px;
      font-weight: 700;
      fill: #fff;
      filter: drop-shadow(0 0 4px rgba(255, 30, 45, 0.9));
    }
    #marcha { font-size: 10px; font-weight: 700; fill: #ffb000; }
    .tt { font-size: 5.6px; fill: #7a7a86; letter-spacing: 0.6px; }
    .led { fill: #24242a; stroke: #3a3a44; stroke-width: 0.6; transition: fill 0.15s; }
    .led.on.verde  { fill: #2eea7a; filter: drop-shadow(0 0 3px #2eea7a); }
    .led.on.blanco { fill: #fff2b0; filter: drop-shadow(0 0 3px #ffe680); }
    .led.on.ambar  { fill: #ffb000; filter: drop-shadow(0 0 3px #ffb000); }
    .led.on.azul   { fill: #3aa0ff; filter: drop-shadow(0 0 3px #3aa0ff); }

    /* La tarjeta del regalo conserva una fuente más legible para la Ñ */
    #tarjetaTitulo { font-family: 'Arial Black', Impact, sans-serif; }

    /* ===== EFECTOS DEL NITRO ===== */
    @keyframes temblor {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(1.2px, -1px); }
      50%  { transform: translate(-1px, 1.2px); }
      75%  { transform: translate(1px, 1px); }
      100% { transform: translate(0, 0); }
    }
    body.nitro #pista,
    body.nitro #tacometro { animation: temblor 0.07s linear infinite; }

    /* Tinte rojo pulsante en los bordes de la pantalla */
    #escena::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      background: radial-gradient(ellipse at 50% 62%, transparent 42%, rgba(255, 30, 45, 0.38) 100%);
    }
    body.nitro #escena::after { opacity: 1; animation: pulsoNitro 0.5s ease-in-out infinite alternate; }
    @keyframes pulsoNitro { from { opacity: 0.5; } to { opacity: 1; } }

    /* Chispas y humo del escape */
    #efectos { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .chispa {
      position: absolute;
      width: 3.5px;
      height: 3.5px;
      margin: -1.75px;
      border-radius: 50%;
      background: #ffd23a;
      box-shadow: 0 0 6px 1px #ff7a00;
    }
    .humo {
      position: absolute;
      width: 16px;
      height: 16px;
      margin: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(205, 205, 215, 0.55), rgba(120, 120, 130, 0) 70%);
      filter: blur(2px);
    }

    /* ===== TARJETA CON MENSAJE QUE SE ESCRIBE SOLO ===== */
    #tarjetaSistema {
      font-family: 'Courier New', monospace;
      color: var(--rojo);
      font-size: 12px;
      letter-spacing: 1px;
      text-align: left;
      margin-bottom: 14px;
      text-shadow: 0 0 8px var(--rojo);
    }
    #tarjetaTitulo { transition: opacity 0.6s; }
    #tarjetaFirma { transition: opacity 0.8s; }
    .cursor::after {
      content: "▌";
      display: inline-block;
      width: 0;
      overflow: visible;
      color: var(--rojo);
      animation: parpadeo 0.7s steps(1) infinite;
    }
    @keyframes parpadeo { 50% { opacity: 0; } }

    /* Foto opcional estilo polaroid */
    #tarjetaFoto {
      display: none;
      width: 78%;
      max-height: 190px;
      object-fit: cover;
      margin: 0 auto 16px;
      padding: 6px 6px 22px;
      background: #f4f4f6;
      border-radius: 4px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6), 0 0 14px rgba(255, 30, 45, 0.35);
      transform: rotate(-2.5deg);
      opacity: 0;
      transition: opacity 0.6s;
    }
    #tarjetaFoto.visible { opacity: 1; }

    /* El botón Cerrar aparece cuando termina de escribirse */
    #btnCerrar { transition: opacity 0.5s; }
    #tarjeta.escribiendo #btnCerrar { opacity: 0; pointer-events: none; }

    #tarjetaFirma { white-space: pre-line; }
    html, body { overscroll-behavior: none; }

    /* ===== AVISO EN HORIZONTAL ===== */
    #girar {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--negro);
      color: var(--rojo);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--rojo);
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #girar { display: flex; }
    }
    /* ===== EL AUTO ENTRA MANEJANDO ===== */
    #auto.entrando { animation: entradaAuto 2.2s cubic-bezier(0.25, 0.5, 0.3, 1) 0.6s both; }
    @keyframes entradaAuto {
      0%   { transform: translateX(-135%); }
      72%  { transform: translateX(2.5%); }
      100% { transform: translateX(0); }
    }
    #auto.entrando #cuerpo {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: cabeceo 2.8s ease-out both;
    }
    @keyframes cabeceo {
      0%, 62% { transform: rotate(0deg); }
      76%     { transform: rotate(1.8deg); }
      100%    { transform: rotate(0deg); }
    }
    body.llegando .rin { animation: girar 0.18s linear infinite; }
    body.llegando .ciudad { animation-play-state: running; }
    body.llegando #carretera { animation-play-state: running; opacity: 1; }

    /* ===== LA DISTANCIA QUE SE ACORTA ===== */
    #ruta {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: min(86%, 320px);
      z-index: 5;
      text-align: center;
      pointer-events: none;
    }
    #rutaCiudades {
      display: flex;
      justify-content: space-between;
      font-size: 7px;
      letter-spacing: 1.5px;
      color: #8a8a95;
      margin-bottom: 6px;
    }
    #rutaBarra {
      position: relative;
      height: 4px;
      border-radius: 3px;
      background: #2a2a30;
    }
    #rutaRelleno {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, #ff1e2d, #ff6b78);
      box-shadow: 0 0 8px var(--rojo);
    }
    #rutaCorazon {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translate(-50%, -52%);
      font-size: 12px;
      line-height: 1;
      color: var(--rojo);
      text-shadow: 0 0 8px var(--rojo);
    }
    #rutaTexto {
      margin-top: 8px;
      font-size: 8px;
      letter-spacing: 1.5px;
      color: #cfcfd6;
    }
    #ruta.llegue #rutaTexto { color: #ffd23a; text-shadow: 0 0 10px #ffd23a; }

    /* ===== SECRETOS ESCONDIDOS ===== */
    header { cursor: pointer; }
    .sec {
      position: absolute;
      z-index: 3;
      transform: translate(-50%, -50%);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #sLuna { left: 84%; top: 13%; width: 48px; height: 48px; border-radius: 50%; }
    #sLuna.hallado {
      background: radial-gradient(circle, rgba(255, 30, 45, 0.55) 0 30%, transparent 70%);
      box-shadow: 0 0 22px rgba(255, 30, 45, 0.6);
    }
    #sEstrella {
      left: 17%;
      top: 24%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd23a;
      font-size: 13px;
      text-shadow: 0 0 8px #ffd23a, 0 0 16px #ff9a00;
      animation: brilloDorado 2.2s ease-in-out infinite;
    }
    @keyframes brilloDorado { 50% { opacity: 0.45; transform: translate(-50%, -50%) scale(0.8); } }
    #sEstrella.hallado { animation: none; font-size: 18px; }
    #sNeon {
      left: 11%;
      top: 40%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: neonParpadeo 3.4s infinite;
    }
    #escena #sNeon svg {
      width: 22px;
      height: 22px;
      max-width: none;
      fill: none;
      stroke: #ff5a8a;
      stroke-width: 1.8;
      filter: drop-shadow(0 0 4px #ff1e6e) drop-shadow(0 0 9px #ff1e6e);
    }
    @keyframes neonParpadeo {
      0%, 46%, 50%, 54%, 100% { opacity: 1; }
      48% { opacity: 0.3; }
      52% { opacity: 0.4; }
    }
    #sNeon.hallado { animation: none; }

    #contador {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 5px;
      transform: translateX(-50%);
      font-size: 7px;
      letter-spacing: 2px;
      color: #7a7a86;
      pointer-events: none;
    }
    #contador.completo { color: #ffd23a; text-shadow: 0 0 8px #ffd23a; }

    #secreto {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: 22%;
      transform: translate(-50%, 8px);
      width: min(84%, 300px);
      padding: 12px 14px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 12.5px;
      line-height: 1.5;
      color: #fff;
      background: rgba(10, 10, 12, 0.86);
      border: 1px solid rgba(255, 30, 45, 0.65);
      border-radius: 12px;
      box-shadow: 0 0 22px rgba(255, 30, 45, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s, transform 0.35s;
    }
    #secreto.visible { opacity: 1; transform: translate(-50%, 0); }

    #corazones { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
    .corazon {
      position: absolute;
      color: #ff4d5e;
      text-shadow: 0 0 8px #ff1e2d;
      line-height: 1;
    }

    /* Premio al encontrar los cinco secretos */
    #cielo #corazonCielo {
      position: absolute;
      left: 50%;
      top: 19%;
      width: 130px;
      height: 130px;
      max-width: none;
      transform: translateX(-50%);
      fill: none;
      stroke: #ff3b6b;
      stroke-width: 0.8;
      opacity: 0;
      transition: opacity 1.5s;
      filter: drop-shadow(0 0 6px #ff1e4d) drop-shadow(0 0 16px #ff1e4d);
    }
    #escena.completo #cielo #corazonCielo { opacity: 0.6; animation: latirCielo 1.6s ease-in-out infinite; }
    @keyframes latirCielo { 50% { transform: translateX(-50%) scale(1.08); } }

    /* La placa gira al tocarla */
    #placa.gira { animation: giraPlaca 0.55s ease-in-out; }
    @keyframes giraPlaca {
      0%, 100% { transform: perspective(300px) rotateX(0deg); }
      50%      { transform: perspective(300px) rotateX(90deg); }
    }

    /* ===== DÍAS JUNTOS EN LA TARJETA ===== */
    #tarjetaDias { opacity: 0; transition: opacity 0.8s; margin: 2px 0 16px; }
    #tarjetaDias.visible { opacity: 1; }
    .odo { display: inline-flex; gap: 4px; }
    .odo b {
      display: inline-block;
      width: 26px;
      height: 36px;
      line-height: 36px;
      font-family: 'Orbitron', 'Arial Black', sans-serif;
      font-size: 20px;
      color: #fff;
      background: #0b0b0e;
      border: 1px solid #3a3a44;
      border-radius: 5px;
      text-shadow: 0 0 8px var(--rojo);
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9);
    }
    #tarjetaDias small {
      display: block;
      margin-top: 8px;
      font-family: 'Orbitron', 'Arial Black', sans-serif;
      font-size: 8px;
      letter-spacing: 1.5px;
      color: #8a8a95;
    }

   </style>

<div id="girar"><div style="font-size:34px">📱</div>PON TU TELÉFONO EN VERTICAL</div>
<script>
  // ====== TEXTO EDITABLE ======
  const CONFIG = {
    nombre: "ALEXIS",
    lineas: [
      "> INICIANDO SISTEMA...",
      "> CARGANDO V10 8.4L...",
      "> VERIFICANDO RINES... OK",
      "> USUARIO: ALEXIS ✔",
      "> LISTO PARA ARRANCAR"
    ]
  };

  const terminal = document.getElementById('terminal');
  const btnEncender = document.getElementById('btnEncender');
  const intro = document.getElementById('intro');

  const esperar = ms => new Promise(r => setTimeout(r, ms));

  async function escribirSecuencia() {
    for (const linea of CONFIG.lineas) {
      const p = document.createElement('div');
      terminal.appendChild(p);
      for (const letra of linea) {
        p.textContent += letra;
        await esperar(35);
      }
      await esperar(350);
    }
    btnEncender.classList.add('visible');
  }

  btnEncender.addEventListener('click', () => {
    if (navigator.vibrate) navigator.vibrate(200);
    intro.classList.add('oculto');
    iniciarAudio();
  });

  // ====== MOTOR V10 ======
  const auto = document.getElementById('auto');
  const btnMotor = document.getElementById('btnMotor');
  let audioCtx = null;
  let motor = null;
  let motorEncendido = false;

  function iniciarAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function arrancarMotor() {
    iniciarAudio();
    const ctx = audioCtx;
    const t = ctx.currentTime;

    const salida = ctx.createGain();
    salida.gain.setValueAtTime(0, t);
    salida.gain.linearRampToValueAtTime(0.5, t + 0.3);

    const filtro = ctx.createBiquadFilter();
    filtro.type = 'lowpass';
    filtro.frequency.value = 450;
    filtro.Q.value = 4;

    // Pulsación del motor
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 13;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 70;
    lfo.connect(lfoGain);
    lfoGain.connect(filtro.frequency);

    // Voces del motor (tipo, multiplicador de frecuencia)
    const voces = [
      { tipo: 'sawtooth', mult: 1 },
      { tipo: 'sawtooth', mult: 1.02 },
      { tipo: 'square',   mult: 0.5 }
    ];
    const oscs = voces.map(v => {
      const o = ctx.createOscillator();
      o.type = v.tipo;
      // Arranque: sube rápido y baja al ralentí
      o.frequency.setValueAtTime(18 * v.mult, t);
      o.frequency.exponentialRampToValueAtTime(110 * v.mult, t + 0.4);
      o.frequency.exponentialRampToValueAtTime(55 * v.mult, t + 1.1);
      o.connect(filtro);
      o.start(t);
      return o;
    });

    filtro.connect(salida);
    salida.connect(ctx.destination);
    lfo.start(t);

    motor = { oscs, voces, lfo, salida, filtro, listo: t + 1.2 };
  }

  function apagarMotor() {
    if (!motor) return;
    const ctx = audioCtx;
    const t = ctx.currentTime;
    const m = motor;
    motor = null;
    m.salida.gain.cancelScheduledValues(t);
    m.salida.gain.setValueAtTime(m.salida.gain.value, t);
    m.salida.gain.linearRampToValueAtTime(0, t + 0.4);
    m.oscs.forEach(o => o.stop(t + 0.45));
    m.lfo.stop(t + 0.45);
  }

  btnMotor.addEventListener('click', () => {
    motorEncendido = !motorEncendido;
    auto.classList.toggle('encendido', motorEncendido);
    if (motorEncendido) {
      arrancarMotor();
      btnMotor.classList.add('activo');
      document.getElementById('lblMotor').textContent = 'STOP';
      if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
    } else {
      apagarMotor();
      btnMotor.classList.remove('activo');
      document.getElementById('lblMotor').textContent = 'START';
    }
  });

  // ====== NITRO Y TACÓMETRO ======
  const btnNitro = document.getElementById('btnNitro');
  const aguja = document.getElementById('aguja');
  let nitroActivo = false;
  let rpm = 0;
  let ultimoAudio = 0;

  function pulsarNitro(e) {
    e.preventDefault();
    if (!motorEncendido) {
      btnNitro.classList.add('aviso');
      btnMotor.classList.add('pista');
      setTimeout(() => {
        btnNitro.classList.remove('aviso');
        btnMotor.classList.remove('pista');
      }, 900);
      return;
    }
    nitroActivo = true;
    if (navigator.vibrate) navigator.vibrate(60);
  }
  function soltarNitro() { nitroActivo = false; }

  btnNitro.addEventListener('pointerdown', pulsarNitro);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
          btnNitro.addEventListener(ev, soltarNitro));
  btnNitro.addEventListener('contextmenu', e => e.preventDefault());

  function actualizar() {
    const objetivo = !motorEncendido ? 0 : (nitroActivo ? 0.95 : 0.12);
    rpm += (objetivo - rpm) * (nitroActivo ? 0.06 : 0.04);

    const temblor = motorEncendido ? Math.sin(Date.now() / 40) * 0.006 : 0;
    const nivel = Math.max(0, Math.min(1, rpm + temblor));
    aguja.style.transform = `rotate(${-90 + nivel * 180}deg)`;

    document.body.classList.toggle('nitro', nitroActivo && motorEncendido);

    if (motor && audioCtx.currentTime > motor.listo) {
      const ahora = audioCtx.currentTime;
      if (ahora - ultimoAudio > 0.05) {
        ultimoAudio = ahora;
        motor.oscs.forEach((o, i) =>
                o.frequency.setTargetAtTime((30 + rpm * 210) * motor.voces[i].mult, ahora, 0.05));
        motor.filtro.frequency.setTargetAtTime(450 + rpm * 1800, ahora, 0.05);
      }
    }
    requestAnimationFrame(actualizar);
  }
  actualizar();

  // ====== CLAXON Y LUCES ALTAS ======
  const btnClaxon = document.getElementById('btnClaxon');
  let claxonOcupado = false;

  function sonarClaxon() {
    iniciarAudio();
    const ctx = audioCtx;
    const t = ctx.currentTime;

    const salida = ctx.createGain();
    salida.gain.setValueAtTime(0, t);
    salida.gain.linearRampToValueAtTime(0.35, t + 0.02);
    salida.gain.setValueAtTime(0.35, t + 0.28);
    salida.gain.linearRampToValueAtTime(0, t + 0.36);

    const filtro = ctx.createBiquadFilter();
    filtro.type = 'lowpass';
    filtro.frequency.value = 1800;

    // Dos tonos, como un claxon real
    [440, 554].forEach(f => {
      const o = ctx.createOscillator();
      o.type = 'square';
      o.frequency.value = f;
      o.connect(filtro);
      o.start(t);
      o.stop(t + 0.4);
    });

    filtro.connect(salida);
    salida.connect(ctx.destination);
  }

  async function destellar() {
    for (let i = 0; i < 3; i++) {
      auto.classList.add('altas');
      await esperar(110);
      auto.classList.remove('altas');
      await esperar(110);
    }
  }

  btnClaxon.addEventListener('click', async () => {
    if (claxonOcupado) return;
    claxonOcupado = true;
    sonarClaxon();
    if (navigator.vibrate) navigator.vibrate(120);
    await destellar();
    claxonOcupado = false;
  });

  // ====== REGALO SECRETO ======
  // ✏️ AQUÍ EDITAS EL MENSAJE DE LA TARJETA
  const REGALO = {
    titulo: "¡FELICES 27 AÑOTES! 🎉",
    texto: "¡Feliz cumpleaños, amor! Como pediste el Viper y soy una estudihambre a distancia, te programé el tuyo propio😉\n\nEres de uso rudo como tus trocas, mi norteño favorito😍\n\nTe quiero mucho❣️\n\nP.D. Aún es versión beta, pero está hecho con mucho cariño jaja 😅",
    firma: "Con amor, tu programadora favorita 💻❤️\n\n...y ya"
  };

  const modal = document.getElementById('modal');
  const btnRegalo = document.getElementById('btnRegalo');
  const btnCerrar = document.getElementById('btnCerrar');
  const lienzo = document.getElementById('confeti');
  const pincel = lienzo.getContext('2d');
  let piezas = [];
  let confetiActivo = false;

  document.getElementById('tarjetaTitulo').textContent = REGALO.titulo;
  document.getElementById('tarjetaTexto').textContent = REGALO.texto;
  document.getElementById('tarjetaFirma').textContent = REGALO.firma;

  function ajustarLienzo() {
    lienzo.width = window.innerWidth;
    lienzo.height = window.innerHeight;
  }
  window.addEventListener('resize', ajustarLienzo);
  ajustarLienzo();

  function lanzarConfeti() {
    const colores = ['#ff1e2d', '#ffffff', '#ffd23a', '#ff6b78'];
    for (let i = 0; i < 160; i++) {
      piezas.push({
        x: Math.random() * lienzo.width,
        y: -20 - Math.random() * lienzo.height * 0.5,
        w: 6 + Math.random() * 6,
        h: 10 + Math.random() * 8,
        vy: 2 + Math.random() * 3.5,
        vx: -1.5 + Math.random() * 3,
        giro: Math.random() * 6,
        vgiro: -0.2 + Math.random() * 0.4,
        color: colores[Math.floor(Math.random() * colores.length)]
      });
    }
    if (!confetiActivo) {
      confetiActivo = true;
      animarConfeti();
    }
  }

  function animarConfeti() {
    pincel.clearRect(0, 0, lienzo.width, lienzo.height);
    piezas.forEach(p => {

    alto.type = 'highpass';

    g.gain.setValueAtTime(volumen, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(alto);
    alto.connect(g);
    g.connect(audioCtx.destination);
    src.start(t);
    src.stop(t + dur + 0.05);
  }

    banda.type = 'bandpass';
    banda.Q.value = 0.8;
    banda.frequency.setValueAtTime(700, t);
    banda.frequency.exponentialRampToValueAtTime(2600, t + 2.5);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.25);
    src.connect(banda);
    banda.connect(g);
    g.connect(audioCtx.destination);
    src.start(t);
    rugido = { src, g };
  }

      o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * 0.09);
      g.gain.linearRampToValueAtTime(0.12, t + i * 0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.45);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t + i * 0.09);
      o.stop(t + i * 0.09 + 0.5);
    });
  }

  function soltarCorazones(x, y) {
    for (let i = 0; i < 9; i++) {
      const c = document.createElement('i');
      c.className = 'corazon';
      c.textContent = '❤';
      c.style.left = x + 'px';
      c.style.top = y + 'px';
      c.style.fontSize = (11 + Math.random() * 10) + 'px';
      capaCorazones.appendChild(c);
      const dx = (Math.random() - 0.5) * 90;
      const dy = -(60 + Math.random() * 90);
      c.animate([
        { transform: 'translate(-50%, -50%) scale(0.4)', opacity: 0 },
        { transform: `translate(calc(-50% + ${dx * 0.4}px), calc(-50% + ${dy * 0.4}px)) scale(1)`, opacity: 1, offset: 0.25 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.8)`, opacity: 0 }
      ], { duration: 1100 + Math.random() * 700, easing: 'ease-out', delay: i * 40, fill: 'both' })
              .onfinish = () => c.remove();
    }
  }

  // ----- Mensaje flotante que se escribe -----
  async function mostrarMensaje(texto, miTurno) {
    const letras = Array.from(texto);
    const escrito = document.createElement('span');
    const resto = document.createElement('span');
    resto.style.visibility = 'hidden';
    resto.textContent = texto;
    toast.textContent = '';
    toast.append(escrito, resto);
    toast.classList.add('visible');
    for (let i = 1; i <= letras.length; i++) {
      if (miTurno !== turnoToast) return false;
      escrito.textContent = letras.slice(0, i).join('');
      resto.textContent = letras.slice(i).join('');
      await esperar(22);
    }
    return true;
  }

  async function mostrarFinal(miTurno) {
    escena.classList.add('completo');
    dingFinal();
    lanzarConfeti();
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    if (!(await mostrarMensaje(SECRETOS.final, miTurno))) return;
    await esperar(4500);
    if (miTurno === turnoToast) toast.classList.remove('visible');
  }

  async function secretoHallado(clave, x, y) {
    const mio = ++turnoToast;
    const nuevo = !hallados.has(clave);
    hallados.add(clave);
    sonidoSecreto();
    soltarCorazones(x, y);
    if (navigator.vibrate) navigator.vibrate(40);
    pintarContador();
    const completo = hallados.size === CLAVES.length;
    if (!(await mostrarMensaje(SECRETOS[clave], mio))) return;
    await esperar(3200);
    if (mio !== turnoToast) return;
    if (nuevo && completo) { mostrarFinal(mio); return; }
    toast.classList.remove('visible');
  }

  function centroDe(el) {
    const r = el.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  }

  // ----- Dónde se tocan -----
  sLuna.addEventListener('click', () => {
    sLuna.classList.add('hallado');
    secretoHallado('luna', ...centroDe(sLuna));
  });
  sEstrella.addEventListener('click', () => {
    sEstrella.classList.add('hallado');
    secretoHallado('estrella', ...centroDe(sEstrella));
  });
  sNeon.addEventListener('click', () => {
    sNeon.classList.add('hallado');
    secretoHallado('neon', ...centroDe(sNeon));
  });

  // La placa gira y muestra la fecha
  let placaOcupada = false;
  function girarPlaca() {
    if (placaOcupada) return;
    placaOcupada = true;
    const original = placa.innerHTML;
    const [, mes, dia] = PAREJA.desde.split('-');
    placa.classList.add('gira');
    setTimeout(() => { placa.innerHTML = `DESDE<b>${dia}·${mes}</b>`; }, 270);
    setTimeout(() => {
      placa.classList.remove('gira');
      void placa.offsetWidth;
      placa.classList.add('gira');
      setTimeout(() => { placa.innerHTML = original; }, 270);
    }, 2800);
    setTimeout(() => { placa.classList.remove('gira'); placaOcupada = false; }, 3500);
  }
  placa.addEventListener('click', e => {
    e.stopPropagation();
    girarPlaca();
    secretoHallado('placa', e.clientX, e.clientY);
  });
  document.querySelector('header').addEventListener('click', e => {
    secretoHallado('titulo', e.clientX, e.clientY);
  });

  // ----- Días juntos: odómetro en la tarjeta -----
  const elDias = document.createElement('div');
  elDias.id = 'tarjetaDias';
  tarjeta.insertBefore(elDias, elFirma);
  let corridaDias = 0;

  function diasJuntos() {
    const [a, m, d] = PAREJA.desde.split('-').map(Number);
    const inicio = new Date(a, m - 1, d);
    const hoy = new Date();
    const hoy0 = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
    return Math.max(0, Math.round((hoy0 - inicio) / 86400000));
  }

  function prepararDias() {
    const n = diasJuntos();
    const cifras = Math.max(3, String(n).length);
    elDias.classList.remove('visible');
    elDias.innerHTML = `<span class="odo">${'<b>0</b>'.repeat(cifras)}</span><small>${PAREJA.etiqueta}</small>`;
    elDias.style.display = n > 0 ? '' : 'none';
  }

  function mostrarDias() {
    const n = diasJuntos();
    if (n <= 0) return;
    const mi = ++corridaDias;
    elDias.classList.add('visible');
    const cajas = elDias.querySelectorAll('.odo b');
    const inicio = performance.now();
    (function paso(ahora) {
      if (mi !== corridaDias) return;
      const p = Math.min(1, (ahora - inicio) / 1500);
      const valor = Math.round(n * (1 - Math.pow(1 - p, 3)));
      const txt = String(valor).padStart(cajas.length, '0');
      cajas.forEach((c, i) => { c.textContent = txt[i]; });
      if (p < 1) requestAnimationFrame(paso);
    })(inicio);
  }

  // Se activa solo: al abrir la tarjeta se reinicia y al terminar de escribirse muestra el odómetro
  new MutationObserver(() => {
    if (tarjeta.classList.contains('escribiendo')) {
      corridaDias++;
      prepararDias();
    } else if (modal.classList.contains('abierto')) {
      mostrarDias();
    }
  }).observe(tarjeta, { attributes: true, attributeFilter: ['class'] });
  prepararDias();

  escribirSecuencia();
</script>
</body>
